services:
  postgres:
    image: postgres:17-alpine
    container_name: qrapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrapi
      POSTGRES_PASSWORD: qrapi
      POSTGRES_DB: qrapi
    ports:
      # 5433 en el host para no chocar con instalaciones nativas de Postgres
      - "5433:5432"
    volumes:
      - qrapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: qrapi-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  qrapi_pgdata:
